<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向 A · 房间里的物件 · 完整一套 — Duck UI/UX</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --room: #14110E; --room-2: #1A1612;
    --cream: #F4EEE4; --cream-70: rgba(244,238,228,.7); --cream-50: rgba(244,238,228,.5);
    --amber: #FF8A3D; --wood: #3A2E22; --brass: #C9A45C;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; background: #0C0A08; color: var(--cream); }
  body { font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  .board {
    min-height: 100vh; padding: 72px 64px 110px;
    background:
      radial-gradient(1100px 700px at 18% 8%, rgba(255,138,61,.10), transparent 60%),
      radial-gradient(900px 900px at 92% 92%, rgba(201,164,92,.06), transparent 60%),
      #0C0A08;
  }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; margin-bottom: 60px; }
  .kicker { font-size: 13px; letter-spacing: .04em; color: var(--cream-50); }
  .title { font-size: 64px; line-height: 1.02; font-weight: 700; letter-spacing: -.01em; margin: 12px 0 0; }
  .title em { font-style: normal; color: var(--amber); }
  .thesis { max-width: 430px; font-size: 15px; line-height: 1.7; color: var(--cream-70); }
  .thesis b { color: var(--cream); font-weight: 600; }
  .row { display: flex; gap: 56px; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; width: 390px; flex: none; }
  .label { font-size: 13px; color: var(--cream-50); letter-spacing: .06em; line-height: 1.6; }
  .label b { color: var(--cream-70); font-weight: 600; letter-spacing: 0; }
  .offset-1 { margin-top: 56px; } .offset-2 { margin-top: 128px; }

  .phone { width: 390px; height: 844px; border-radius: 54px; position: relative; overflow: hidden;
    background: var(--room); box-shadow: 0 40px 90px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,255,255,.06); }
  .phone::after { content: ""; position: absolute; inset: 0; border-radius: 54px; pointer-events: none; box-shadow: inset 0 0 0 10px #060504; }
  .notch { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 112px; height: 34px; border-radius: 20px; background: #050404; z-index: 40; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 62px; z-index: 35; display: flex; align-items: center; justify-content: space-between; padding: 22px 30px 0; font-size: 15px; font-weight: 600; color: var(--cream); }
  .status .dots { display: flex; gap: 3px; align-items: center; }
  .status i { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--cream-70); }
  .screen { position: absolute; inset: 0; }

  /* room */
  .room-scene { position: absolute; inset: 0; overflow: hidden; }
  .room-floor { position: absolute; left: -10%; right: -10%; bottom: 0; height: 36%;
    background: linear-gradient(180deg, rgba(56,50,44,0) 0%, #2A241E 34%, #221D18 100%); }
  .floor-line { position: absolute; left: 0; right: 0; bottom: 34%; height: 1px; background: rgba(255,214,160,.08); }
  .halo { position: absolute; left: 50%; top: 44%; width: 430px; height: 430px; transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,173,102,.16), rgba(255,173,102,0) 62%); }
  .duck { position: absolute; left: 50%; top: 44%; width: 268px; transform: translate(-50%,-50%);
    filter: drop-shadow(0 26px 30px rgba(0,0,0,.55));
    -webkit-mask-image: radial-gradient(ellipse 64% 60% at 50% 48%, #000 54%, transparent 78%);
    mask-image: radial-gradient(ellipse 64% 60% at 50% 48%, #000 54%, transparent 78%);
    transition: transform .38s cubic-bezier(.2,.9,.25,1), filter .3s ease; }
  .duck.lifted { transform: translate(-50%,-50%) translateY(-46px) rotate(-2deg); }
  .duck.spin { animation: spin .9s ease-in-out; }
  @keyframes spin { 0% { transform: translate(-50%,-50%) rotate(0); } 40% { transform: translate(-50%,-50%) rotate(-14deg) scale(1.02); } 100% { transform: translate(-50%,-50%) rotate(0); } }
  .duck.nibble { animation: nibble .5s ease; }
  @keyframes nibble { 0%,100% { transform: translate(-50%,-50%); } 50% { transform: translate(-50%,-46%) scale(.985); } }
  .duck.shiver { animation: shiver .5s ease; }
  @keyframes shiver { 0%,100% { transform: translate(-50%,-50%); } 25% { transform: translate(-49%,-50%) rotate(1deg); } 75% { transform: translate(-51%,-50%) rotate(-1deg); } }
  .shadow-pool { position: absolute; left: 50%; top: 66%; width: 210px; height: 34px; transform: translate(-50%,-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); }
  .room-title { position: absolute; top: 74px; left: 30px; }
  .room-title .name { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .room-title .state { margin-top: 2px; font-size: 13px; color: var(--cream-50); }

  /* wall clock — a long wooden regulator case; the point is the pointer you pull back */
  .long-clock { position: absolute; top: 68px; right: 22px; width: 34px; height: 84px; cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease; }
  .long-clock:hover { transform: translateY(-1px); }
  .long-clock .case {
    position: absolute; inset: 5px 0 8px; border-radius: 6px 6px 4px 4px;
    background:
      repeating-linear-gradient(90deg, rgba(255,225,180,.05) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #4E3E2B 0%, #3A2E22 52%, #2A2018 100%);
    box-shadow: inset 0 1px 0 rgba(255,225,180,.25), inset 0 -2px 0 rgba(0,0,0,.5), 0 10px 22px rgba(0,0,0,.55);
    border: 1px solid rgba(20,16,12,.8);
  }
  .long-clock .case::before { content: ""; position: absolute; inset: 4px 4px auto; height: 1px; background: rgba(255,225,180,.2); }
  .long-clock .face { position: absolute; left: 6px; right: 6px; top: 10px; bottom: 16px; border-radius: 3px;
    background:
      repeating-linear-gradient(180deg, rgba(244,238,228,.30) 0 1px, transparent 1px 7px),
      radial-gradient(120% 80% at 50% 0%, rgba(255,180,110,.10), transparent 60%),
      linear-gradient(180deg, #191410, #0E0B08);
    box-shadow: inset 0 0 0 1px rgba(244,238,228,.10), inset 0 6px 10px rgba(0,0,0,.6);
  }
  .long-clock .face::after { content: ""; position: absolute; left: 0; right: 0; top: 33%; height: 1.5px; background: rgba(255,138,61,.75); box-shadow: 0 0 8px rgba(255,138,61,.5); }
  .long-clock .hand {
    position: absolute; left: 2px; right: 2px; top: 31%; height: 6px; border-radius: 3px;
    background: linear-gradient(180deg, #FFC08A, var(--amber) 60%, #C9621F);
    box-shadow: 0 1px 4px rgba(0,0,0,.6), 0 0 10px rgba(255,138,61,.35);
  }
  .long-clock .hand::after { content: ""; position: absolute; right: -4px; top: 1px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--brass); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .long-clock .bob {
    position: absolute; left: 50%; bottom: 1px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #E7C87E, #9A7433 70%);
    box-shadow: 0 2px 4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.35);
  }
  .long-clock .bob::before { content: ""; position: absolute; left: 50%; top: -7px; width: 1px; height: 7px; background: rgba(201,164,92,.75); }
  .long-clock .hook { position: absolute; left: 50%; top: 0; width: 10px; height: 7px; margin-left: -5px;
    border: 1px solid rgba(201,164,92,.55); border-bottom: 0; border-radius: 6px 6px 0 0; }
  .long-clock .num { position: absolute; left: 50%; transform: translateX(-50%); font-size: 6px; line-height: 1;
    color: rgba(244,238,228,.45); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .long-clock .num.top { top: 5px; } .long-clock .num.bottom { bottom: 17px; }
  .long-clock .cap { position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%); font-size: 8px; color: var(--cream-50); white-space: nowrap; }

  /* wall barometer — round brass, many needles, dense ticks: a reading device */
  .barometer { position: absolute; top: 172px; right: 22px; width: 54px; height: 54px; border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(244,238,228,.32) 0deg 0.9deg, transparent 0.9deg 9deg),
      radial-gradient(circle at 38% 30%, #2B241C, #14100C 74%);
    box-shadow: 0 0 0 3px #3E3223, 0 0 0 4px rgba(201,164,92,.55), inset 0 0 0 1px rgba(0,0,0,.6), 0 8px 16px rgba(0,0,0,.55);
    cursor: pointer; transition: transform .2s ease; }
  .barometer:hover { transform: scale(1.05); }
  .barometer::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(201,164,92,.35); }
  .barometer .needle { position: absolute; left: 50%; top: 50%; width: 1.4px; height: 18px; margin-left: -.7px; margin-top: -18px; transform-origin: bottom center; }
  .barometer .needle.hpa { background: linear-gradient(180deg, #E7C87E, var(--brass)); transform: rotate(24deg); }
  .barometer .needle.temp { width: 1px; height: 14px; margin-left: -.5px; margin-top: -14px; background: var(--amber); opacity: .85; transform: rotate(-38deg); }
  .barometer .pivot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .barometer .unit { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    font-size: 5px; letter-spacing: .08em; color: rgba(244,238,228,.4); }
  .barometer .cap { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); font-size: 8px; color: var(--cream-50); white-space: nowrap; }

  /* shelf */
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px 30px;
    background: linear-gradient(180deg, rgba(58,46,34,0) 0%, rgba(58,46,34,.55) 22%, rgba(44,35,26,.92) 60%, #241D16 100%); }
  .shelf-board { position: relative; height: 132px; border-radius: 26px;
    background: linear-gradient(180deg, #4A3B2A 0%, #3A2E22 46%, #2C231A 100%);
    box-shadow: inset 0 1px 0 rgba(255,225,180,.18), inset 0 -2px 0 rgba(0,0,0,.4), 0 -14px 30px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
  .shelf-board::before { content: ""; position: absolute; inset: 14px 18px auto; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,225,180,.14), transparent); }
  .object { position: relative; cursor: pointer; transition: transform .18s ease; text-align: center; }
  .object:hover { transform: translateY(-3px); }
  .object:active { transform: translateY(1px) scale(.97); }
  .object .cap { margin-top: 8px; font-size: 12px; color: var(--cream-70); letter-spacing: .04em; }
  .object.disabled { opacity: .4; pointer-events: none; }

  .bowl { width: 62px; height: 34px; border-radius: 0 0 34px 34px / 0 0 30px 30px;
    background: linear-gradient(180deg, #F2EBDD 0%, #D9CFBC 70%, #BFB3A0 100%);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.55), 0 6px 12px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  .bowl .food { position: absolute; left: 4px; right: 4px; top: 3px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #E9B45E, #B87A2A 70%); transition: height .35s ease; }
  .deck { position: relative; width: 40px; height: 54px; }
  .deck i { position: absolute; inset: 0; border-radius: 7px; background: linear-gradient(180deg, #2E2A24, #1E1A15);
    box-shadow: inset 0 0 0 1px rgba(244,238,228,.24); }
  .deck i:nth-child(2) { transform: rotate(-7deg) translateX(-5px); }
  .deck i:nth-child(3) { transform: rotate(4deg) translateX(4px); }
  .deck .pip { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; background: var(--amber); transform: rotate(45deg); border-radius: 1px; }
  .bell { width: 46px; height: 40px; border-radius: 24px 24px 6px 6px;
    background: radial-gradient(circle at 34% 26%, #E7C87E, #B08A3E 58%, #7C5D24 100%);
    box-shadow: inset 0 -6px 10px rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.5); position: relative; }
  .bell::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #8A6A2C; box-shadow: inset 0 1px 2px rgba(255,240,200,.5); }
  .hand { width: 44px; height: 50px; position: relative; }
  .hand .palm { position: absolute; bottom: 0; left: 4px; width: 36px; height: 30px; border-radius: 12px 12px 16px 16px;
    background: linear-gradient(180deg, #E9DFCE, #CBBEA8); box-shadow: inset 0 2px 3px rgba(255,255,255,.5), 0 6px 12px rgba(0,0,0,.5); }
  .hand .f1, .hand .f2, .hand .f3, .hand .f4 { position: absolute; bottom: 24px; width: 7px; border-radius: 4px;
    background: linear-gradient(180deg, #EFE6D6, #C9BCA6); box-shadow: inset 0 1px 2px rgba(255,255,255,.5); }
  .hand .f1 { left: 7px; height: 22px; } .hand .f2 { left: 16px; height: 26px; }
  .hand .f3 { left: 25px; height: 24px; } .hand .f4 { left: 33px; height: 18px; }
  .drawer-handle { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 84px; height: 22px; border-radius: 12px; cursor: pointer;
    background: rgba(0,0,0,.28); box-shadow: inset 0 1px 3px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,220,170,.12);
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .drawer-handle i { width: 3px; height: 3px; border-radius: 50%; background: rgba(244,238,228,.4); }

  .ripple { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%;
    border: 1.5px solid rgba(255,138,61,.75); pointer-events: none; animation: ripple .7s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  .say { position: absolute; left: 50%; bottom: 246px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px;
    background: rgba(20,17,14,.82); box-shadow: inset 0 0 0 1px rgba(244,238,228,.10), 0 8px 22px rgba(0,0,0,.4);
    font-size: 13px; color: var(--cream); white-space: nowrap; z-index: 6; }

  /* drawer */
  .scrim { position: absolute; inset: 0; background: rgba(6,5,4,.62); z-index: 4; }
  .drawer { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; z-index: 8;
    background: linear-gradient(180deg, #3B2F23 0%, #2A2118 8%, #1C1712 100%);
    box-shadow: 0 -18px 48px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,180,.16);
    padding: 12px 22px 26px; transition: transform .3s cubic-bezier(.2,.9,.25,1); }
  .drawer .grip { width: 92px; height: 22px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: grab; }
  .drawer .grip i { width: 3px; height: 3px; border-radius: 50%; background: rgba(244,238,228,.35); }
  .drawer-title { font-size: 13px; letter-spacing: .18em; color: var(--cream-50); margin: 0 2px 10px; }
  .compartment { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .slot { border-radius: 16px; padding: 12px 12px 10px; cursor: pointer;
    background: linear-gradient(180deg, rgba(255,236,208,.05), rgba(0,0,0,.22));
    box-shadow: inset 0 0 0 1px rgba(244,238,228,.08), 0 6px 14px rgba(0,0,0,.3);
    transition: transform .16s ease, box-shadow .16s ease; }
  .slot:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,138,61,.35), 0 8px 18px rgba(0,0,0,.35); }
  .slot .g { font-size: 15px; font-weight: 600; }
  .slot .n { margin-top: 2px; font-size: 11px; color: var(--cream-50); }
  .slot.hot { box-shadow: inset 0 0 0 1px rgba(255,138,61,.6); background: linear-gradient(180deg, rgba(255,138,61,.14), rgba(0,0,0,.2)); }

  /* tray page (second drawer) */
  .tray { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; border-radius: 26px 26px 0 0; padding: 14px 22px 30px;
    max-height: 690px; overflow: hidden;
    background: linear-gradient(180deg, #43362A 0%, #2C2319 10%, #1B1611 100%);
    box-shadow: 0 -20px 50px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,225,180,.2); }
  .tray .grip { width: 92px; height: 20px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tray .grip i { width: 3px; height: 3px; border-radius: 50%; background: rgba(244,238,228,.35); }
  .tray h3 { margin: 2px 0 2px; font-size: 20px; font-weight: 700; }
  .tray .sub { font-size: 12px; color: var(--cream-50); margin-bottom: 12px; }
  .ledger { border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(244,238,228,.10); }
  .ledger-row { display: flex; gap: 14px; padding: 13px 14px; align-items: baseline;
    background: linear-gradient(180deg, rgba(255,240,214,.04), rgba(0,0,0,.12)); }
  .ledger-row + .ledger-row { border-top: 1px solid rgba(244,238,228,.07); }
  .ledger-row .t { width: 44px; font-size: 11px; color: var(--cream-50); font-variant-numeric: tabular-nums; }
  .ledger-row .w { flex: 1; font-size: 14px; }
  .ledger-row .w b { color: var(--amber); font-weight: 600; }
  .ledger-row .n { font-size: 11px; color: var(--cream-50); }

  /* time machine */
  .tm-scrim { position: absolute; inset: 0; background: rgba(6,5,4,.8); z-index: 4; }
  .tm { position: absolute; left: 0; right: 0; bottom: 0; height: 566px; z-index: 8; border-radius: 32px 32px 0 0; padding: 22px 22px 24px;
    background:
      repeating-linear-gradient(90deg, rgba(255,225,180,.04) 0 1px, transparent 1px 5px),
      linear-gradient(180deg, #43351F 0%, #2C2318 26%, #1A1510 100%);
    box-shadow: 0 -20px 60px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,225,180,.22), inset 0 0 0 1px rgba(0,0,0,.5); }
  .tm-case { position: relative; margin-top: 14px; border-radius: 14px; padding: 16px 16px 18px;
    background:
      repeating-linear-gradient(90deg, rgba(255,225,180,.05) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, #4E3E2B, #332819 70%);
    box-shadow: inset 0 1px 0 rgba(255,225,180,.22), inset 0 -2px 0 rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.5);
    border: 1px solid rgba(16,12,9,.85); }
  .tm-case::before, .tm-case::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E7C87E, #8A6A2C 75%); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .tm-case::before { left: 6px; top: 6px; } .tm-case::after { right: 6px; top: 6px; }
  .tm h3 { margin: 0; font-size: 20px; font-weight: 700; }
  .tm .sub { margin-top: 3px; font-size: 12px; color: var(--cream-50); }
  .dial { position: relative; height: 250px; margin-top: 2px; cursor: ns-resize; border-radius: 8px; padding: 6px 8px;
    background: radial-gradient(120% 80% at 50% 0%, rgba(255,180,110,.08), transparent 60%), linear-gradient(180deg, #191410, #0D0A07);
    box-shadow: inset 0 0 0 1px rgba(244,238,228,.10), inset 0 8px 14px rgba(0,0,0,.6); }
  .dial .tick { position: absolute; left: 0; right: 0; height: 1px; background: rgba(244,238,228,.07); }
  .dial .tick.major { background: rgba(244,238,228,.16); }
  .dial .tick .t { position: absolute; right: 0; top: -8px; font-size: 10px; color: var(--cream-50); font-variant-numeric: tabular-nums; }
  .dial .ev { position: absolute; left: 0; display: flex; align-items: center; gap: 8px; transition: opacity .2s ease; }
  .dial .ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px rgba(255,138,61,.6); }
  .dial .ev span { font-size: 12px; color: var(--cream-70); }
  .dial .play { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, rgba(255,138,61,0), var(--amber), rgba(255,138,61,0)); box-shadow: 0 0 14px rgba(255,138,61,.5); }
  .dial .play::after { content: ""; position: absolute; left: 50%; top: -6px; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #FFD9A8, var(--amber) 60%, #B6541B); transform: translateX(-50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.6); }
  .tm-controls { display: flex; gap: 10px; margin-top: 16px; }
  .tm-btn { flex: 1; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: rgba(255,236,208,.06); box-shadow: inset 0 0 0 1px rgba(244,238,228,.10); font-size: 14px; color: var(--cream); cursor: pointer; }
  .tm-btn:hover { background: rgba(255,236,208,.11); }
  .tm-btn.key { background: var(--amber); color: #1A1208; font-weight: 700; box-shadow: none; }

  /* instrument wall panel */
  .panel { position: absolute; left: 20px; right: 20px; top: 124px; bottom: 36px; z-index: 8; border-radius: 20px; padding: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(255,225,180,.035) 0 1px, transparent 1px 5px),
      linear-gradient(180deg, #2C2418, #1A1510 70%);
    box-shadow: 0 0 0 3px #3E3223, 0 0 0 4px rgba(201,164,92,.45), inset 0 1px 0 rgba(255,225,180,.2), 0 24px 50px rgba(0,0,0,.55); }
  .panel::before, .panel::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E7C87E, #8A6A2C 75%); box-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .panel::before { left: 8px; bottom: 8px; } .panel::after { right: 8px; bottom: 8px; }
  .dial-row { display: flex; gap: 12px; justify-content: space-between; }
  .dgauge { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dgauge .face { position: relative; width: 74px; height: 74px; border-radius: 50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(244,238,228,.30) 0deg 0.8deg, transparent 0.8deg 12deg),
      radial-gradient(circle at 38% 30%, #241D15, #0F0C08 74%);
    box-shadow: 0 0 0 3px #3E3223, 0 0 0 4px rgba(201,164,92,.42), inset 0 0 0 1px rgba(0,0,0,.6); }
  .dgauge .needle { position: absolute; left: 50%; top: 50%; width: 1.4px; height: 26px; margin-left: -.7px; margin-top: -26px;
    transform-origin: bottom center; background: linear-gradient(180deg, #FFD9A8, var(--amber) 70%); }
  .dgauge .pivot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    background: var(--brass); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .dgauge .val { font-size: 12px; color: var(--cream); font-weight: 600; font-variant-numeric: tabular-nums; }
  .dgauge .lab { font-size: 10px; color: var(--cream-50); letter-spacing: .08em; }
  .panel h4 { margin: 0 0 14px; font-size: 12px; letter-spacing: .2em; color: var(--cream-50); font-weight: 600; }
  .gauge { margin-bottom: 14px; }
  .gauge .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--cream-70); margin-bottom: 6px; }
  .gauge .lab b { color: var(--cream); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: rgba(244,238,228,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #FFB26E, var(--amber)); }
  .sensor-row { display: flex; gap: 10px; margin-top: 16px; }
  .sensor { flex: 1; border-radius: 14px; padding: 10px; background: rgba(255,236,208,.04);
    box-shadow: inset 0 0 0 1px rgba(244,238,228,.07); text-align: center; }
  .sensor .ico { height: 34px; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
  .sensor .ico i { width: 3px; border-radius: 2px; background: var(--amber); opacity: .8; }
  .sensor .k { margin-top: 6px; font-size: 11px; color: var(--cream-50); }

  /* cards */
  .cards-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; border-radius: 30px 30px 0 0; padding: 16px 22px 30px;
    background: linear-gradient(180deg, #3B2F23 0%, #2A2118 10%, #1C1712 100%);
    box-shadow: 0 -18px 48px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,225,180,.16); }
  .cards-sheet h3 { margin: 0; font-size: 20px; font-weight: 700; }
  .cards-sheet .sub { margin-top: 3px; font-size: 12px; color: var(--cream-50); }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .skill-card { border-radius: 16px; padding: 14px; cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #51402D, #33281C); box-shadow: inset 0 0 0 1px rgba(255,225,180,.14), 0 8px 18px rgba(0,0,0,.35);
    transition: transform .16s ease; }
  .skill-card:hover { transform: translateY(-3px); }
  .skill-card .g { font-size: 22px; }
  .skill-card .n { margin-top: 6px; font-size: 15px; font-weight: 600; }
  .skill-card .d { margin-top: 2px; font-size: 11px; color: var(--cream-50); }
  .skill-card .corner { position: absolute; right: 10px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,138,61,.8); }

  /* comparison */
  .compare { margin-top: 96px; padding-top: 48px; border-top: 1px solid rgba(244,238,228,.12); }
  .compare h2 { margin: 0 0 8px; font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
  .compare .sub { font-size: 14px; color: var(--cream-70); max-width: 720px; line-height: 1.7; }
  .compare-row { display: flex; gap: 72px; align-items: flex-start; margin-top: 40px; flex-wrap: wrap; }
  .shipped img { display: block; width: 390px; border-radius: 12px; box-shadow: 0 30px 70px rgba(0,0,0,.6); }
</style>
</head>

          <div className="cap">技能</div>
        </div>
        <div className={off} onClick={onQuack}>
          {ripple === "quack" && <div className="ripple" />}

        </div>
        <div className={off} onClick={onGrab}>
          {ripple === "grab" && <div className="ripple" />}

}

function CardsSheet({ onClose, onPick }) {

function TimeMachine({ onClose, pct, setPct }) {
  const moments = [
    { top: 18, s: "10:12", t: "被摸了 3 次" },
    { top: 44, s: "13:40", t: "摔了一下，自己起来" },
    { top: 70, s: "16:05", t: "跟着口哨唱" },
  ];
  const drag = e => {
    if (e.buttons !== 1) return;
    const r = e.currentTarget.getBoundingClientRect();
    setPct(Math.max(0, Math.min(100, ((e.clientY - r.top) / r.height) * 100)));
  };
  const near = moments.reduce((a, m) => Math.abs(m.top - pct) < Math.abs(a.top - pct) ? m : a, moments[0]);
  return (
    <>
      <div className="tm-scrim" onClick={onClose} />
      <div className="tm">
        <h3>时间机器</h3>
        <div className="sub">挂钟 · 把指针往回拨 · 今天保留了 4 分 20 秒 · <span style={{ color: "var(--amber)" }}>{Math.abs(near.top - pct) < 14 ? near.s : "现在"}</span></div>
        <div className="tm-case">
        <div className="dial" onMouseMove={drag} onMouseDown={drag}>
          {[0, 1, 2, 3, 4, 5, 6].map(i => (
            <div key={i} className={`tick ${i % 3 === 0 ? "major" : ""}`} style={{ top: `${i * 44}px` }}>
              {i % 2 === 0 && <span className="t">{`15:0${i * 2}`}</span>}
            </div>
          ))}
          {moments.map(m => (
            <div key={m.s} className="ev" style={{ top: `${m.top}%`, opacity: Math.abs(m.top - pct) < 14 ? 1 : .45 }}>
              <i /><span>{m.t}</span>
            </div>
          ))}
          <div className="play" style={{ top: `${pct}%` }} />
        </div>
        </div>
        <div className="tm-controls">
          <div className="tm-btn">冻结</div>
          <div className="tm-btn">单步</div>
          <div className="tm-btn key" onClick={onClose}>回到这一刻</div>
        </div>
      </div>
    </>
  );
}

          <div className="sensor">
            <div className="ico">{Array.from({ length: 6 }, (_, i) => <i key={i} style={{ height: 10 + ((i * 5) % 18) }} />)}</div>
            <div className="k">脚下的地</div>
          </div>
        </div>
        <h4 style={{ marginTop: 20 }}>今天</h4>
        <div style={{ fontSize: 13, color: "var(--cream-70)", lineHeight: 1.8 }}>
          走了 128 米 · 被摸 3 次 · 学会一个动作<br />
          15:12 第一次自己翻过身来
        </div>
      </div>
    </>
  );
}
const DialGauge = ({ label, value, angle }) => (
  <div className="dgauge">
    <div className="face">
      <div className="needle" style={{ transform: `rotate(${angle}deg)` }} />
      <div className="pivot" />
    </div>
    <div className="val">{value}</div>
    <div className="lab">{label}</div>
  </div>
);

const Gauge = ({ label, value, w }) => (
  <div className="gauge">
    <div className="lab"><span>{label}</span><b>{value}</b></div>
    <div className="bar"><i style={{ width: w }} /></div>
  </div>
);

function DiaryTray({ onClose }) {
  const rows = [
    ["10:12", <>被<b>摸了摸</b>，尾巴摆了两下</>, "×3"],
    ["11:40", <>在房间里<b>走了一圈</b></>, "128 m"],
    ["13:40", <><b>摔了一下</b>，17 秒后自己站起来</>, "×1"],
    ["15:12", <>第一次<b>自己翻身</b></>, "新"],
    ["16:05", <>听到口哨，回了<b>三声</b></>, ""],
  ];
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <div className="tray">
        <div className="grip" onClick={onClose}><i /><i /><i /></div>
        <h3>日记</h3>
        <div className="sub">只有真实发生的事 · 不是写出来的</div>
        <div className="ledger">
          {rows.map(([t, w, n]) => (
            <div key={t} className="ledger-row">
              <span className="t">{t}</span><span className="w">{w}</span><span className="n">{n}</span>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 14, fontSize: 12, color: "var(--cream-50)", lineHeight: 1.7 }}>
          今天的章节：早上被摸了两回；午后摔了一次，自己起来了；现在头歪着看窗外。
        </div>
      </div>
    </>
  );
}

function HeroPhone() {
  const [sheet, setSheet] = React.useState(null); // drawer | cards | time | instrument | diary
  const [food, setFood] = React.useState(10);
  const [eaten, setEaten] = React.useState(0);
  const [held, setHeld] = React.useState(false);
  const [ripple, setRipple] = React.useState(null);
  const [say, setSay] = React.useState(null);
  const [duckClass, setDuckClass] = React.useState("");
  const [dialPct, setDialPct] = React.useState(52);
  const [note, setNote] = React.useState(null);
  const timer = React.useRef(null);

  const flash = (cls, text, key) => {
    setDuckClass(cls); setSay(text); setRipple(key || null);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { setDuckClass(""); setSay(s => s === text ? null : s); setRipple(null); }, 2400);
  };

  const feed = () => {
    setEaten(e => e + 1);
    if (food <= 4) { setFood(14); flash("nibble", "碗见底了，添了一口饭", "feed"); }
    else { setFood(f => Math.max(2, f - 3)); flash("nibble", "吃到了一口 · 今天第 " + (eaten + 1) + " 次", "feed"); }
  };
  const quack = () => flash("shiver", "嘎！它回头看你", "quack");
  const grab = () => { setHeld(h => !h); flash("", held ? "放回地上了" : "被拎起来了，脚还在蹬", "grab"); };
  const pick = name => { setSheet(null); flash("spin", "它做了：" + name); };
  const row = (name, what) => {
    if (name === "日记") { setSheet("diary"); return; }
    if (name === "技能卡盒") { setSheet("cards"); return; }
    setNote(what); setTimeout(() => setNote(null), 2600);
  };

  return (
    <div className="phone">
      <div className="screen">
        <Room duckClass={(held ? "lifted " : "") + duckClass} dim={sheet === "time" || sheet === "instrument"} />
        <Notch /><Status />
        <div className="room-title">
          <div className="name">MicroDuck</div>
          <div className="state">{held ? "在你手上" : "散步中"}</div>
        </div>
        <div className="long-clock" onClick={() => setSheet("time")} title="时间机器 · 挂钟">
          <div className="hook" />
          <div className="case">
            <div className="face" />
            <div className="hand" />
            <span className="num top">15</span><span className="num bottom">16</span>
          </div>
          <div className="bob" />
          <div className="cap">挂钟</div>
        </div>
        <div className="barometer" onClick={() => setSheet("instrument")} title="身体读数 · 气压表">
          <div className="needle hpa" /><div className="needle temp" /><div className="pivot" />
          <span className="unit">hPa</span><div className="cap">读数</div>
        </div>
        <Caption text={say} />
        <Shelf food={food} held={held} ripple={ripple} disabled={!!sheet}
          onFeed={feed} onCards={() => setSheet("cards")} onQuack={quack} onGrab={grab} />
        <div className="drawer-handle" onClick={() => setSheet("drawer")}><i /><i /><i /></div>
        {sheet === "drawer" && <Drawer onClose={() => setSheet(null)} onRow={row} note={note} />}
        {sheet === "cards" && <CardsSheet onClose={() => setSheet(null)} onPick={pick} />}
        {sheet === "time" && <TimeMachine onClose={() => setSheet(null)} pct={dialPct} setPct={setDialPct} />}
        {sheet === "instrument" && <Instrument onClose={() => setSheet(null)} />}
        {sheet === "diary" && <DiaryTray onClose={() => setSheet(null)} />}
      </div>
    </div>
  );
}

function StaticPhone({ children, duckClass, dim }) {
  return (
    <div className="phone">
      <div className="screen">
        <Room duckClass={duckClass} dim={dim} />
        <Notch /><Status />
        {children}
      </div>
    </div>
  );
}

);
