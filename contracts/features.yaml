    group: none
    page: time-bar
    hops: 1
    conform_b4: extension
    note: 时间类控制定在时间栏（UI_B4_PLAN.md §5:116 唯一可引先例，老板拍板采纳）
    ios: implemented
    android: implemented
    data_chain: none
  - id: tilt-look
