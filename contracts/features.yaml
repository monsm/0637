    group: duck
    page: null
    hops: 0
    conform_b4: ok
    note: 首层行动作（入睡/唤醒）
    ios: implemented
    android: implemented
    data_chain: none
  - id: duck-panel
    door: true
    zh: 这只鸭子
    group: duck
    page: duck-panel
    hops: 1
