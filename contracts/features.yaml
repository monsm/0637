# features.yaml — IA 4×4 重排唯一事实源（老板 2026-11-16 拍板）
#
# 来源：docs/UIUX_REFACTOR_2026-11-15.md §9 回拍板项①。三套互斥方案里取
# 小满版骨架（唯一引用 §5:116 先例「时间类控制定在时间栏」），按老板新约束
# 重算：每目的页控件 ≤6；首层 4 组 × ≤4 行（16 行预算）；倒放归时间栏。
#
# 结构：首层行（groups[].rows）= 抽屉里的一行；一行打开一个目的页
# （pages[]），或在原地执行一个动作。22+2 功能按页面归位，不是每项都占行。
#
# 分组数学（16 行）：
#   玩      4 行  画路走 / 积木规则 / 编舞铺 / 玩一玩
#   一起    4 行  邻居 / 合唱 / 互送礼物 / 双人接机
#   记录    4 行  每日任务 / 鸭子日记 / 明信片 / 情绪图鉴
#   这只鸭子 4 行  AI 伙伴 / 晚安 / 这只鸭子 / 工具
# 目的页（每页 ≤6 控件）：
#   玩一玩：操控方式、AB 试穿、推把对比、HUD
#   邻居：配对码、DKPD 收发、ensemble、合唱、礼物
#   每日任务：任务板、成长手册(iOS)、日子行
#   这只鸭子：心跳、手电筒、语言、罗盘、教它说话（倾斜看 iOS-only）
#   工具：家长时长、房间灯、备份、ToF、大字模式、日子
#   积木规则：定时器（触发档位）；编舞铺：LED 灯光步；日记：开口说话
# 倒放不占行（时间栏）。
#
# 老板规矩：
#   1. 本文件是重排唯一事实源。两端入口位置、分组、跳数、enabled-when 全部
#      从本表读；改分组先改这里，再搬入口（「契约先红、再搬入口」）。
#   2. 每目的页控件 ≤6。超了就拆页或调分组，不许堆墙。
#   3. 做完两端入口必须一一对应（同名同组同页同跳数），check-ui-features.py 守。
#   4. 只改入口不改账：每日任务/成长手册的数据链两端不动（B4 §7）。
#   5. not-implemented 项必须写明原因，禁止渲染假数（FIDELITY §0.1）。
#   6. 22+2 起账：地面高度/轨迹导出无 UI，标 not-implemented + 核心路由备注。

meta:
  ruling_date: "2026-11-16"
  ruling_source: "老板拍板：docs/UIUX_REFACTOR_2026-11-15.md §9 三项回拍板①"
  scheme: "小满版骨架 + ≤6 约束重算（三套方案取最稳）"
  groups: 4
  first_layer_budget_rows: 16
  per_page_max_controls: 6
  max_hops_from_live: 2

# 首层四组，行序即抽屉里的顺序。rows 是首层行 id 列表（≤4）。
groups:
  - id: play
    zh: 玩
    destination: play
    rows: [path-draw, blocks, dance, play-more]
  - id: together
    zh: 一起
    destination: together
    rows: [peers, chorus, gifts, two-player]
  - id: record
    zh: 记录
    destination: record
    rows: [quests, diary, postcards, dex]
  - id: duck
    zh: 这只鸭子
    destination: duck
    rows: [ai, night, duck-panel, tools]

# 目的页：一行打开一页。controls 是该页可点控件数（含页内动作，不含只读
# 遥测），必须 ≤6。entries 列出该页承载的功能 id。
pages:
  - id: play-more
    group: play
    zh: 玩一玩
    controls: 4
    entries: [stick-modes, ab-try, push-compare, hud]
  - id: neighbours
    group: together
    zh: 邻居
    controls: 5
    entries: [pairing, dkpd, ensemble, chorus, gifts]
  - id: quests
    group: record
    zh: 每日任务
    controls: 3
    entries: [quests, progress-book, day-rows]
  - id: duck-panel
    group: duck
    zh: 这只鸭子
    controls: 6
    entries: [heart, flashlight, language, compass, tilt-look, alias]
  - id: tools
    group: duck
    zh: 工具
    controls: 6
    entries: [parent-time, room-lamp, backup, tof, big-buttons, days]
  - id: ai
    group: duck
    zh: AI 伙伴
    controls: 1
    entries: [ai]
  - id: blocks
    group: play
    zh: 积木规则
    controls: 2
    entries: [blocks, timer]
  - id: dance
    group: play
    zh: 编舞铺
    controls: 2
    entries: [dance, led]
  - id: diary
    group: record
    zh: 鸭子日记
    controls: 2
    entries: [diary, speak]
  - id: postcards
    group: record
    zh: 明信片
    controls: 1
    entries: [postcards]
  - id: dex
    group: record
    zh: 情绪图鉴
    controls: 1
    entries: [dex]
  - id: night
    group: duck
    zh: 晚安/早安
    controls: 1
    entries: [night]
  - id: time-bar
    group: none
    zh: 时间栏
    controls: 1
    entries: [rewind-play]

# 功能台账：22 项 + 2 项 no-ui；另加 iOS 独有的成长手册/成就墙与倾斜看、
# 以及 定时器/大字/日子行/教它说话/日子 等扩展项，共 44 行。
# enabled_when: 门控（无邻居时 ensemble/合唱/礼物 可见但禁用，不是消失）。
# data_chain: 只改入口不改账的边界声明。
features:
  - id: path-draw
    zh: 画路走
    group: play
    page: null
    hops: 1
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: blocks
    zh: 积木规则
    group: play
    page: blocks
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: dance
    zh: 编舞铺
    group: play
    page: dance
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: play-more
    door: true
    zh: 玩一玩
    group: play
    page: play-more
    hops: 2
    conform_b4: extension
    note: 首层门；页内收 操控方式/AB/推把/HUD
    ios: implemented
    android: implemented
    data_chain: none
  - id: stick-modes
    zh: 操控方式
    group: play
    page: play-more
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: ab-try
    zh: AB 试穿
    group: play
    page: play-more
    hops: 2
    conform_b4: extension
    ios: implemented
    android: implemented
    data_chain: none
  - id: push-compare
    zh: 推一把对比
    group: play
    page: play-more
    hops: 2
    conform_b4: extension
    ios: implemented
    android: implemented
    data_chain: none
  - id: hud
    zh: 观测摘录 HUD
    group: play
    page: play-more
    hops: 2
    conform_b4: extension
    note: opt-in 覆盖层默认关
    ios: implemented
    android: implemented
    data_chain: none
  - id: timer
    zh: 定时器触发器
    group: play
    page: blocks
    hops: 2
    conform_b4: extension
    note: 积木规则页内触发 chip 的一个档位，不占首层行
    ios: implemented
    android: implemented
    data_chain: none

  - id: peers
    zh: 邻居
    group: together
    page: neighbours
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: pairing
    zh: 邻居配对码
    group: together
    page: neighbours
    hops: 2
    conform_b4: extension
    ios: implemented
    android: implemented
    data_chain: none
  - id: dkpd
    zh: 网控手柄
    group: together
    page: neighbours
    hops: 2
    conform_b4: extension
    ledger_ids: [netpad-rx, netpad-tx]
    note: 收发两端合并为一个目的页控件；发送端 iOS 经 -duck.peerFixture 验证可达（B3 已修 FE-1）
    ios: implemented
    android: implemented
    data_chain: none
  - id: ensemble
    zh: 舞团/合奏
    group: together
    page: neighbours
    hops: 2
    conform_b4: extension
    enabled_when: "peers.isEmpty() ? disabled : enabled"
    note: 无邻居时可见但禁用，不消失（IA-4，B2 已修）
    ios: implemented
    android: implemented
    data_chain: none
  - id: chorus
    zh: 家庭合唱
    group: together
    page: neighbours
    hops: 2
    conform_b4: extension
    enabled_when: "peers.isEmpty() ? disabled : enabled"
    ios: implemented
    android: implemented
    data_chain: none
  - id: gifts
    zh: 互送礼物
    group: together
    page: neighbours
    hops: 2
    conform_b4: extension
    enabled_when: "peers.isEmpty() ? disabled : enabled"
    ios: implemented
    android: implemented
    data_chain: none
  - id: two-player
    zh: 双人接机
    group: together
    page: null
    hops: 1
    conform_b4: extension
    note: 首层行动作（开/关），无目的页
    ios: implemented
    android: implemented
    data_chain: none

  - id: quests
    zh: 每日任务
    group: record
    page: quests
    hops: 2
    conform_b4: ok
    data_chain: ios=ProgressStore+7日瓦片+成就墙；android=3任务+连续天数（只改入口不改账，B4 §7）
    ios: implemented
    android: implemented
  - id: progress-book
    zh: 成长手册/成就墙
    group: record
    page: quests
    hops: 2
    conform_b4: extension
    note: 两端同页同条件；Android 2026-11-16 立项补齐（真实事件账、零回填、空就是空，docs/PROGRESS_ANDROID.md）
    ios: implemented
    android: implemented
    data_chain: 各端本机事件账（iOS ProgressStore / Android ProgressStore），语义同源；不迁移、不互抄历史
  - id: day-rows
    zh: 日子行
    group: record
    page: quests
    hops: 2
    conform_b4: extension
    note: iOS 渲染缺失已修（B3，FE-3）；Android 仪表内渲染待搬进每日任务页
    ios: implemented
    android: implemented
    data_chain: none
  - id: diary
    zh: 鸭子日记
    group: record
    page: diary
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: speak
    zh: 开口说话（日记 TTS）
    group: record
    page: diary
    hops: 3
    conform_b4: extension
    note: 日记页内 chip，首屏无独立入口（P2 已知）
    ios: implemented
    android: implemented
    data_chain: none
  - id: postcards
    zh: 明信片
    group: record
    page: postcards
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: dex
    zh: 情绪图鉴
    group: record
    page: dex
    hops: 2
    conform_b4: ok
    ledger_ids: [collection-open, badges]
    note: 图鉴抽屉行两端同页；鸭子面板/仪表里的第二枚图鉴入口（collection-open）与图鉴页徽章架（badges，只读遥测不计控件）同一笔账
    ios: implemented
    android: implemented
    data_chain: none

  - id: ai
    zh: AI 伙伴
    group: duck
    page: ai
    hops: 1
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: night
