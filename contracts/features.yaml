    group: duck
    page: duck-panel
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: big-buttons
    zh: 大字模式
    group: duck
    page: tools
    hops: 2
    conform_b4: extension
    note: 两端同页（2026-11-16 老板拍板挪鸭子组；2026-11-19 H2 鸭子面板满 6，大字随 ≤6 挪工具页，两端同迁，id/tag 不变）
