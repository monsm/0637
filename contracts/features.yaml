    conform_b4: extension
    ios: implemented
    android: implemented
    data_chain: none
  - id: flashlight
    zh: 手电筒
    group: duck
    page: duck-panel
    hops: 2
    conform_b4: ok
    ios: implemented
    android: implemented
    data_chain: none
  - id: language
