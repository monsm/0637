    group: duck
    page: duck-panel
    hops: 2
    conform_b4: extension
    note: iOS 独有（手机 IMU 当头部），Android 不提供是硬件差异不是设计债（COMPANION.md §1）
    ios: implemented
    android: not-implemented
    reason: "平台事实：Android 无此能力，文档已声明"
    data_chain: none
  - id: voice-zh
    zh: 语音指令
    group: none
    page: null
    hops: 1
    conform_b4: extension
    note: 保留在仪表内（读说开关），不属于本次抽屉重排
    ios: implemented
    android: implemented
