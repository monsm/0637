    zh: LED 灯语
    group: play
    page: dance
    hops: 2
    conform_b4: extension
    note: 编舞铺灯光步内，无独立首层行
    ios: implemented
    android: implemented
    data_chain: none

  # —— 22+2 的 +2：核心有路由、UI 无入口 ——
