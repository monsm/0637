name: Duck
options:
  bundleIdPrefix: ai.duck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Duck:
    type: application
    platform: iOS
    sources:
      - path: DuckApp
        excludes:
          - "DuckResources/**"
          # Shaders.metal is copied into DuckResources by
          # stage-resources.sh and compiled at runtime. Excluded here so
          # Xcode does not turn it into a root-level default.metallib
          # (which Xcode 26 refuses to code sign).
          - "Shaders/**"
      # Shaders.metal lives inside the Resources folder reference, which is
      # copied verbatim: Xcode never compiles it, so no default.metallib ends
      # up at the bundle root (Xcode 26 refuses to code sign that), and the
      # app compiles the shader at runtime instead.
      - path: DuckApp/DuckResources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.duck.microduck
        # CoreSimulator needs CFBundleVersion to identify the app; the
        # generated Info.plist only carries it when these are set.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Xcode 26 defaults Debug builds to the "debug dylib" layout
        # (Duck.debug.dylib + __preview.dylib, stub executable). CLI-built
        # apps in that mode are signed with Identifier=Duck-<hash> and an
        # unbound Info.plist, and CoreSimulator then refuses to install them
        # with a misleading "Missing bundle ID".
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: MicroDuck
        INFOPLIST_KEY_NSMotionUsageDescription: "Shake your phone to push the digital duck."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "The local intent API lets your own AI agent drive the duck."
        SWIFT_OBJC_BRIDGING_HEADER: DuckApp/DuckCore-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/duck-mobile-core/include
        OTHER_LDFLAGS:
          - -L$(SRCROOT)/Frameworks
          - -lduck_mobile_core
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      # Embedded and signed by Xcode's own phases instead of script phases:
      # a script-copied framework confused codesign into ignoring the app's
      # Info.plist ("Info.plist=not bound"), and CoreSimulator then refuses
      # the install with "Missing bundle ID".
      - framework: Frameworks/libduck_mobile_core.dylib
        embed: true
        codeSign: true
      # ONNX Runtime is linked statically INTO libduck_mobile_core.dylib, so
      # the app only needs it at link time. Embedding the xcframework put an
      # inert 33 KB stub (with a temp-path install name) in the bundle.
      - framework: third_party/onnxruntime.xcframework
        embed: false
        codeSign: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
    preBuildScripts:
      - name: Check Rust core
        basedOnDependencyAnalysis: false
        script: |
          test -f "${SRCROOT}/Frameworks/libduck_mobile_core.dylib" || {
            echo "error: run ios/scripts/build-rust-ios.sh first"; exit 1;
          }
