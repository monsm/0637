name: Duck
options:
  bundleIdPrefix: ai.duck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Duck:
    type: application
    platform: iOS
    sources:
      - path: DuckApp
        excludes:
          - "Resources/**"
      - path: DuckApp/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.duck.microduck
        # CoreSimulator needs CFBundleVersion to identify the app; the
        # generated Info.plist only carries it when these are set.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: MicroDuck
        INFOPLIST_KEY_NSMotionUsageDescription: "Shake your phone to push the digital duck."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "The local intent API lets your own AI agent drive the duck."
        SWIFT_OBJC_BRIDGING_HEADER: DuckApp/DuckCore-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core/duck-mobile-core/include
        OTHER_LDFLAGS:
          - -L$(SRCROOT)/Frameworks
          - -lduck_mobile_core
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
    preBuildScripts:
      - name: Check Rust core
        basedOnDependencyAnalysis: false
        script: |
          test -f "${SRCROOT}/Frameworks/libduck_mobile_core.dylib" || {
            echo "error: run ios/scripts/build-rust-ios.sh first"; exit 1;
          }
    postBuildScripts:
      - name: Embed Rust core
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          cp "${SRCROOT}/Frameworks/libduck_mobile_core.dylib" "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign --force --sign "$IDENTITY" --timestamp=none \
            "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libduck_mobile_core.dylib"
      - name: Embed ONNX Runtime
        basedOnDependencyAnalysis: false
        script: |
          # ort-sys links the XCFramework's onnxruntime.framework dynamically,
          # so the app has to carry it. The slice name differs between Xcode
          # versions; take whichever the archive has for this simulator.
          XCFWK="${SRCROOT}/third_party/onnxruntime.xcframework"
          if [ ! -d "$XCFWK" ]; then
            echo "warning: $XCFWK not found — run ios/scripts/fetch-ort-ios.sh"
            exit 0
          fi
          for slice in $( [ "${PLATFORM_NAME}" = "iphonesimulator" ] \
              && echo "ios-arm64_x86_64-simulator ios-arm64-simulator" \
              || echo "ios-arm64" ); do
            if [ -d "$XCFWK/$slice/onnxruntime.framework" ]; then
              mkdir -p "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
              rm -rf "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
              cp -R "$XCFWK/$slice/onnxruntime.framework" \
                "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/"
              IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              /usr/bin/codesign --force --sign "$IDENTITY" --timestamp=none \
                "${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
              exit 0
            fi
          done
          echo "warning: no simulator slice in $XCFWK"
          # Sign last, after every nested component is in place. Recent
          # CoreSimulator refuses to install a completely unsigned bundle
          # (reported as "Missing bundle ID"); CI builds with
          # CODE_SIGNING_ALLOWED=NO, so ad-hoc sign here. Xcode 26 treats the
          # compiled Metal library as nested code and --deep needs it signed.
          if [ -f "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/default.metallib" ]; then
            /usr/bin/codesign --force --sign - --timestamp=none \
              "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/default.metallib" || true
          fi
          /usr/bin/codesign --force --deep --sign - --timestamp=none \
            "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}"
