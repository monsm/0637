name: Android

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: bash android/scripts/install-sdk.sh

      - name: Environment
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: android/third_party
          key: mcpnjs-dhqmow-3.10.9-v1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          prefix-key: duck-core-android

      - name: Fetch upstream sources and policies
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone --depth 1 https://github.com/pollen-robotics/microduck.git upstream/microduck
          mkdir -p policies
          for f in velstand.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roulade.onnx ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done

      - name: MuJoCo Android
        run: bash android/scripts/build-mujoco-android.sh

      - name: ONNX Runtime Android
        run: bash android/scripts/fetch-ort-android.sh

      - name: Stage assets
        run: bash android/scripts/stage-resources.sh

      - name: Rust core
        run: bash android/scripts/build-rust-android.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find ios/third_party android/third_party -maxdepth 3 -name '*.log' \
            -exec cp {} ci-logs/ \; 2>/dev/null || true
          cp sdk-packages.log ci-logs/ 2>/dev/null || true
          ls -la ci-logs || true
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add ci-logs || true
          git commit -m "ci-logs: run ${{ github.run_id }} [skip ci]" || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main || true

      - uses: actions/upload-artifact@v4
        with:
          name: Duck-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
