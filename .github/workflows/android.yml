name: Android

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      # The upstream patch changes what the core compiles against, so a patch
      # edit is a build input even when no Rust file moved.
      - "patches/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        id: sdk
        run: bash android/scripts/install-sdk.sh

      - name: Environment
        id: env
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          # The runner preinstalls an NDK; use exactly that one everywhere
          # (cargo-ndk prefers ANDROID_NDK_ROOT and warns on a mismatch).
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT:-$SDK_ROOT/ndk/27.3.13750724}" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Rust targets and cargo-ndk
        id: rusttoolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          # Target std must go into the pinned toolchain: core/rust-toolchain.toml
          # selects it for the build, and targets are per-toolchain.
          rustup target add --toolchain 1.99.1 aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Fetch upstream sources and policies
        id: upstream
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone https://github.com/pollen-robotics/microduck.git upstream/microduck
          git -C upstream/microduck checkout da34a22
          git -C upstream/microduck apply "$GITHUB_WORKSPACE/patches/duck-control-mobile.patch"
          mkdir -p policies
          # The complete official set: the manifest references all of these,
          # and a missing file silently removes a feature (crouch needs
          # roller_crouch, the stand policy is the fallback walk slot).
          for f in velstand.onnx alpha_walking.onnx alpha_stand.onnx \
                   roller.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roller_crouch.onnx roulade.onnx \
                   ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done

      - name: Cache native deps
        id: cachendk
        uses: actions/cache@v4
        with:
          path: android/third_party
          key: mcpnjs-dhqmow-3.10.9-v1

      - name: Cache Rust
        id: cacherust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          prefix-key: duck-core-android

      - name: MuJoCo Android
        id: mujoco
        run: bash android/scripts/build-mujoco-android.sh

      - name: ONNX Runtime Android
        id: ort
        run: bash android/scripts/fetch-ort-android.sh

      - name: Stage assets
        id: stage
        run: bash android/scripts/stage-resources.sh

      - name: Rust core
        id: rustcore
        run: bash android/scripts/build-rust-android.sh

      - name: Keep unstripped core for symbolizing crashes
        id: unstripped
        if: always()
        run: |
          mkdir -p unstripped
          cp core/target/aarch64-linux-android/release/libduck_mobile_core.so unstripped/ 2>/dev/null || true
          cp core/target/x86_64-linux-android/release/libduck_mobile_core.so unstripped/ 2>/dev/null || true
          cp -r core/target/android-libdl-stub unstripped/ 2>/dev/null || true
          cp android/third_party/link-*.map unstripped/ 2>/dev/null || true
          ls -la unstripped

      - uses: gradle/actions/setup-gradle@v4
        id: gradlesetup
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: apk
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          if ! gradle -p android assembleDebug --no-daemon --stacktrace \
            > android-gradle.log 2>&1; then
            echo "::error::gradle failed"
            tail -n 120 android-gradle.log || true
            tail -n 200 android-gradle.log >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs/android
          # Overlay the previous logs FIRST: this run's copies must win over
          # what is already on the branch, not the other way round.
          git fetch --depth 1 origin ci-logs \
            && git checkout FETCH_HEAD -- ci-logs || true
          find android/third_party -maxdepth 3 -name '*.log' \
            -exec cp {} ci-logs/android/ \; 2>/dev/null || true
          cp sdk-packages.log ci-logs/android/ 2>/dev/null || true
          cp android-gradle.log ci-logs/android/ 2>/dev/null || true
          {
            echo "run=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "java=${{ steps.java.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "env=${{ steps.env.outcome }}"
            echo "rusttoolchain=${{ steps.rusttoolchain.outcome }}"
            echo "upstream=${{ steps.upstream.outcome }}"
            echo "cachendk=${{ steps.cachendk.outcome }}"
            echo "cacherust=${{ steps.cacherust.outcome }}"
            echo "mujoco=${{ steps.mujoco.outcome }}"
            echo "ort=${{ steps.ort.outcome }}"
            echo "stage=${{ steps.stage.outcome }}"
            echo "rustcore=${{ steps.rustcore.outcome }}"
            echo "gradlesetup=${{ steps.gradlesetup.outcome }}"
            echo "apk=${{ steps.apk.outcome }}"
          } > ci-logs/android/steps.txt
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add -f ci-logs || true
          git commit -m "ci-logs: Android run ${{ github.run_id }} [skip ci]" || true
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git push --force "$URL" HEAD:refs/heads/ci-logs; then break; fi
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: Duck-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check 16 KB page alignment
        id: alignment
        run: |
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          status=0
          for so in android/app/src/main/jniLibs/*/lib*.so; do
            echo "== $so"
            aligns=$("$READELF" -l "$so" | awk '/LOAD/{print $NF}')
            echo "$aligns" | sort -u | tr '\n' ' '
            echo
            # Every LOAD segment must be 16 KB aligned for Android 15+ devices.
            if echo "$aligns" | grep -qv "0x4000"; then
              echo "::error::$so has LOAD segments below 16 KB alignment — the app will crash on Android 15+ devices"
              status=1
            fi
          done
          exit $status

      - name: Check no bionic static-libc stubs leaked in
        id: stubs
        run: |
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          status=0
          # libdl.a (the static-executable shim) defines these with globals
          # that are never initialised in a shared library; if any of them is
          # defined in our .so, the shim was pulled in and the app will crash
          # in malloc/newlocale at startup.
          HOSTILE='malloc|free|calloc|realloc|newlocale|setlocale|strtod|__errno|abort|__cxa_atexit|__cxa_guard_acquire|getauxval'
          for so in android/app/src/main/jniLibs/*/libduck_mobile_core.so; do
            bad=$("$NM" -D --defined-only "$so" | awk '{print $3}' | grep -xE "$HOSTILE" || true)
            if [ -n "$bad" ]; then
              echo "::error::$so defines bionic static-libc symbols: $(echo $bad)"
              status=1
            else
              echo "$so: clean"
            fi
          done
          exit $status

      - name: Enable KVM for the emulator
        id: kvm
        run: |
          # The runner exposes /dev/kvm but the build user is not in the kvm
          # group; the emulator then falls back to software emulation, which
          # is ~50x slower and stalls MuJoCo's scene load.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo "no /dev/kvm; the emulator will run in software mode"
          fi

      - name: Emulator smoke test
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/scripts/smoke-test.sh

      - name: Publish smoke-test logs
        id: publishlogs
        if: always()
        run: |
          mkdir -p ci-logs/android
          cp android-logcat.log ci-logs/android/ 2>/dev/null || true
          cp am-start.log ci-logs/android/ 2>/dev/null || true
          cp intent-state.json ci-logs/android/ 2>/dev/null || true
          cp intent-state-walking.json ci-logs/android/ 2>/dev/null || true
          cp intent-skills.json ci-logs/android/ 2>/dev/null || true
          cp intent-sound.json ci-logs/android/ 2>/dev/null || true
          cp intent-skill-refused.json ci-logs/android/ 2>/dev/null || true
          cp android-screen.png ci-logs/android/ 2>/dev/null || true
          cp android-screen-2.png ci-logs/android/ 2>/dev/null || true
          echo "run=${{ github.run_id }}" > ci-logs/android/smoke.txt
          echo "emulator=${{ steps.emulator.outcome }}" >> ci-logs/android/smoke.txt
          echo "alignment=${{ steps.alignment.outcome }}" >> ci-logs/android/smoke.txt
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git fetch --depth 1 origin ci-logs \
            && git checkout FETCH_HEAD -- ci-logs || true
          git add -f ci-logs || true
          git commit -m "ci-logs: Android smoke run ${{ github.run_id }} [skip ci]" || true
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git push --force "$URL" HEAD:refs/heads/ci-logs; then break; fi
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Duck-android-smoke-logs
          path: |
            android-logcat.log
            am-start.log
            intent-state.json
            intent-state-walking.json
            intent-skills.json
            intent-sound.json
            intent-skill-refused.json
            android-screen.png
            android-screen-2.png
            unstripped/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Duck-core-unstripped
          path: unstripped/
