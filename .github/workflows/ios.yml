name: iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream sources and policies
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone --depth 1 https://github.com/pollen-robotics/microduck.git upstream/microduck
          mkdir -p policies
          for f in velstand.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roulade.onnx ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done

      - name: Toolchain
        run: |
          brew install xcodegen cmake ninja
          rustup target add aarch64-apple-ios-sim

      - name: ONNX Runtime iOS
        run: bash ios/scripts/fetch-ort-ios.sh

      - name: MuJoCo iOS
        run: bash ios/scripts/build-mujoco-ios.sh

      - name: Stage resources
        run: bash ios/scripts/stage-resources.sh

      - name: Rust core
        run: bash ios/scripts/build-rust-ios.sh aarch64-apple-ios-sim

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build simulator app
        run: |
          xcodebuild \
            -project ios/Duck.xcodeproj \
            -scheme Duck \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          find ios/third_party android/third_party -maxdepth 3 -name '*.log' \
            -exec cp {} ci-logs/ \; 2>/dev/null || true
          cp ios/third_party/rust-*.log ci-logs/ 2>/dev/null || true
          ls -la ci-logs || true
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add ci-logs || true
          git commit -m "ci-logs: run ${{ github.run_id }} [skip ci]" || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main || true

      - uses: actions/upload-artifact@v4
        with:
          name: Duck-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Duck.app
