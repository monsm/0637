name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "core/**"
      # The upstream patch changes what the core compiles against, so a patch
      # edit is a build input even when no Rust file moved.
      - "patches/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A device IPA needs an Apple signing identity. These jobs are no-ops
  # (skipped) until the repository has the signing secrets; the simulator
  # app below stays the default artifact.
  check-signing:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "signing secrets present — a device IPA will be built"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "no signing secrets — skipping the device IPA"
          fi

  device:
    needs: check-signing
    if: needs.check-signing.outputs.available == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch upstream sources and policies
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone https://github.com/pollen-robotics/microduck.git upstream/microduck
          git -C upstream/microduck checkout da34a22
          git -C upstream/microduck apply "$GITHUB_WORKSPACE/patches/duck-control-mobile.patch"
          mkdir -p policies
          for f in velstand.onnx alpha_walking.onnx alpha_stand.onnx \
                   roller.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roller_crouch.onnx roulade.onnx \
                   ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done
      - name: Toolchain
        run: |
          brew install xcodegen cmake ninja
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-apple-ios
      - uses: actions/cache@v4
        with:
          path: ios/third_party
          key: ios-device-btmlkj-eidckx3.80.4-moe5.19.7-s5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          prefix-key: duck-core-ios-device
      - name: ONNX Runtime iOS
        run: bash ios/scripts/fetch-ort-ios.sh
      - name: MuJoCo iOS (device slice)
        run: BUILD_DEVICE=1 bash ios/scripts/build-mujoco-ios.sh
      - name: Stage resources
        run: bash ios/scripts/stage-resources.sh
      - name: Rust core (device)
        run: bash ios/scripts/build-rust-ios.sh aarch64-apple-ios
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: Import signing identity
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p build "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p build "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN"             -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s             -k build "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode             > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
      - name: Archive and export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}
        run: |
          set -o pipefail
          cd ios
          xcodebuild             -project Duck.xcodeproj             -scheme Duck             -configuration Release             -sdk iphoneos             -archivePath "$RUNNER_TEMP/Duck.xcarchive"             DEVELOPMENT_TEAM="$TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Development"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             archive > "$RUNNER_TEMP/archive.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/archive.log"; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>ai.duck.microduck</key><string>$PROFILE_NAME</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/Duck.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/ipa"             > "$RUNNER_TEMP/export.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/export.log"; exit 1; }
          ls -la "$RUNNER_TEMP/ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Duck-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Pre-boot simulator in the background
        id: preboot
        run: |
          # The runner image's iOS runtime has never been booted, so the first
          # boot runs data migration that can take minutes. Start it now and
          # let it overlap the MuJoCo/Rust/Xcode build.
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "::error::no available simulator device"
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$UDID" > sim-boot.log 2>&1 &
          nohup xcrun simctl bootstatus "$UDID" -b > sim-bootstatus.log 2>&1 &
          echo "pre-booting $UDID in the background"

      - name: Fetch upstream sources and policies
        id: upstream
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone https://github.com/pollen-robotics/microduck.git upstream/microduck
          git -C upstream/microduck checkout da34a22
          git -C upstream/microduck apply "$GITHUB_WORKSPACE/patches/duck-control-mobile.patch"
          mkdir -p policies
          # The complete official set: a missing file silently removes a
          # feature (crouch needs roller_crouch, the stand policy is the
          # fallback walk slot).
          for f in velstand.onnx alpha_walking.onnx alpha_stand.onnx \
                   roller.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roller_crouch.onnx roulade.onnx \
                   ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done

      - name: Toolchain
        id: toolchain
        run: |
          brew install xcodegen cmake ninja
          rustup toolchain install 1.99.1 --profile minimal
          # Target std must go into the pinned toolchain: core/rust-toolchain.toml
          # selects it for the build, and targets are per-toolchain.
          rustup target add --toolchain 1.99.1 aarch64-apple-ios-sim aarch64-apple-ios

      - name: Cache native deps
        id: cachendk
        uses: actions/cache@v4
        with:
          path: ios/third_party
          key: ios-bkiicy-vbedbj9.18.9-zka6.50.6-q6

      - name: Cache Rust
        id: cacherust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          prefix-key: duck-core-ios

      - name: ONNX Runtime iOS
        id: ort
        run: bash ios/scripts/fetch-ort-ios.sh

      - name: MuJoCo iOS
        id: mujoco
        run: bash ios/scripts/build-mujoco-ios.sh

      - name: Stage resources
        id: stage
        run: bash ios/scripts/stage-resources.sh

      - name: Rust core
        id: rustcore
        run: bash ios/scripts/build-rust-ios.sh aarch64-apple-ios-sim

      - name: Generate Xcode project
        id: xcodegen
        run: |
          cd ios
          xcodegen generate

      - name: Build simulator app
        id: xcodebuild
        run: |
          set -o pipefail
          mkdir -p ios/build
          if ! xcodebuild \
            -project ios/Duck.xcodeproj \
            -scheme Duck \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build > ios/build/xcodebuild.log 2>&1; then
            echo "::error::xcodebuild failed"
            tail -n 120 ios/build/xcodebuild.log || true
            tail -n 200 ios/build/xcodebuild.log >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs/ios
          # Overlay the previous logs FIRST: this run's copies must win over
          # what is already on the branch, not the other way round.
          git fetch --depth 1 origin ci-logs \
            && git checkout FETCH_HEAD -- ci-logs || true
          find ios/third_party -maxdepth 3 -name '*.log' \
            -exec cp {} ci-logs/ios/ \; 2>/dev/null || true
          cp ios/build/xcodebuild.log ci-logs/ios/ 2>/dev/null || true
          cp ios/build/xcodebuild-test.log ci-logs/ios/ 2>/dev/null || true
          cp ios/build-device/xcodebuild.log ci-logs/ios/xcodebuild-device.log 2>/dev/null || true
          {
            echo "run=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "upstream=${{ steps.upstream.outcome }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "cachendk=${{ steps.cachendk.outcome }}"
            echo "cacherust=${{ steps.cacherust.outcome }}"
            echo "ort=${{ steps.ort.outcome }}"
            echo "mujoco=${{ steps.mujoco.outcome }}"
            echo "stage=${{ steps.stage.outcome }}"
            echo "rustcore=${{ steps.rustcore.outcome }}"
            echo "xcodegen=${{ steps.xcodegen.outcome }}"
            echo "xcodebuild=${{ steps.xcodebuild.outcome }}"
            echo "simsmoke=${{ steps.simsmoke.outcome }}"
          } > ci-logs/ios/steps.txt
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add -f ci-logs || true
          git commit -m "ci-logs: iOS run ${{ github.run_id }} [skip ci]" || true
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # A merge, not a force: the two workflows publish to this branch at
          # the same time, and a force push silently drops the other one's
          # logs. Hang our commit off the branch head so the push fast-forwards,
          # and keep both sides' files — ours were copied last, so they win.
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin ci-logs || true
            git reset --soft FETCH_HEAD 2>/dev/null || true
            git add -f ci-logs
            git commit -m "ci-logs: run ${{ github.run_id }} [skip ci]" || true
            if git push "$URL" HEAD:refs/heads/ci-logs; then break; fi
            sleep 2
          done

      - name: Simulator smoke test
        id: simsmoke
        run: |
          set -uo pipefail
          APP="ios/build/Build/Products/Debug-iphonesimulator/Duck.app"
          UDID="$SIM_UDID"
          if [ ! -d "$APP" ]; then
            echo "::error::app bundle missing at $APP"; exit 1
          fi
          echo "simulator UDID $UDID"
          for i in $(seq 1 90); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break
            sleep 10
          done
          if ! xcrun simctl list devices | grep "$UDID" | grep -q Booted; then
            echo "::error::simulator did not finish booting"
            tail -20 sim-boot.log sim-bootstatus.log 2>/dev/null || true
            exit 1
          fi
          # Every Mach-O in the simulator bundle must be a simulator slice.
          bash ios/scripts/check-platforms.sh "$APP" IOSSIMULATOR || exit 1
          # A scripted session: install, launch, drive the duck through its
          # own intent API and look at the frames.
          # Tee the session's own PASS/FAIL lines: the step log is not
          # downloadable without admin rights, but the artifact is.
          mkdir -p sim-drive
          set -o pipefail
          STATUS=0
          bash ios/scripts/sim-drive.sh "$APP" "$UDID" sim-drive 2>&1 | tee sim-drive/session.log || STATUS=$?
          cp sim-drive/state-initial.json intent-state.json 2>/dev/null || true
          cp sim-drive/skills.json intent-skills.json 2>/dev/null || true
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/Duck-ios-simulator.zip" "$(basename "$APP")")
          exit "$STATUS"

      - name: UI test (buttons drive the duck)
        id: uitest
        run: |
          set -o pipefail
          mkdir -p ios/build
          # The Python session left the app running with the intent server on
          # :8765; the UI test launches its own instance.
          xcrun simctl terminate "$SIM_UDID" ai.duck.microduck > /dev/null 2>&1 || true
          if ! xcodebuild test \
            -project ios/Duck.xcodeproj \
            -scheme Duck \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            > ios/build/xcodebuild-test.log 2>&1; then
            echo "::error::UI test failed"
            tail -n 160 ios/build/xcodebuild-test.log || true
            exit 1
          fi
          # No failure here: the tests above already decided the step. A grep
          # that matches nothing must not turn a passing suite into a red run.
          grep -E "Test Suite|Test Case|Executed" ios/build/xcodebuild-test.log | tail -20 || true
          xcrun simctl shutdown "$SIM_UDID" || true

      - name: MuJoCo iOS (device slice)
        id: mujocodev
        if: always()
        run: BUILD_DEVICE=1 bash ios/scripts/build-mujoco-ios.sh

      - name: Rust core (device)
        id: rustdevice
        if: always()
        run: bash ios/scripts/build-rust-ios.sh aarch64-apple-ios

      - name: Build unsigned device app
        id: xcodebuilddev
        if: always()
        run: |
          set -o pipefail
          mkdir -p ios/build-device
          # The device build shares the runner with the simulator build, so
          # give it its own Swift module cache rather than whatever the
          # simulator build left behind. MODULE_CACHE_DIR is an Xcode build
          # setting; an environment variable does nothing, so it is passed on
          # the command line.
          if ! xcodebuild \
            -project ios/Duck.xcodeproj \
            -scheme Duck \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath ios/build-device \
            MODULE_CACHE_DIR="$PWD/ios/build-device/ModuleCache" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > ios/build-device/xcodebuild.log 2>&1; then
            echo "::error::xcodebuild (device) failed"
            tail -n 120 ios/build-device/xcodebuild.log || true
            exit 1
          fi
          # Every Mach-O in the bundle must be an iOS image, not a simulator
          # one: a simulator slice installs fine and then dies in dyld before
          # the first frame. /usr/lib/swift/libswiftsimd.dylib is NOT a
          # simulator-only library (it lives in the device dyld shared cache),
          # so its presence here is not a failure.
          bash ios/scripts/check-platforms.sh \
            ios/build-device/Build/Products/Release-iphoneos/Duck.app IOS || exit 1
          # The renderer compiles Shaders.metal at runtime. Without it the
          # app installs, answers on :8765 and shows a black 3D view - the
          # exact failure the user saw, which the Debug simulator build also
          # reproduced while the whole-frame check still passed.
          test -f ios/build-device/Build/Products/Release-iphoneos/Duck.app/DuckResources/Shaders.metal || {
            echo "::error::device bundle has no DuckResources/Shaders.metal"
            ls -la ios/build-device/Build/Products/Release-iphoneos/Duck.app/DuckResources/ | head -20 || true
            exit 1
          }

      - name: Package unsigned IPA
        id: ipa
        if: always() && steps.xcodebuilddev.outcome == 'success'
        run: |
          set -euo pipefail
          APP="ios/build-device/Build/Products/Release-iphoneos/Duck.app"
          if [ ! -d "$APP" ]; then
            echo "::error::device app bundle missing at $APP"
            exit 1
          fi
          rm -rf Payload Duck-ios-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Duck-ios-unsigned.ipa Payload
          ls -la Duck-ios-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          lipo -info "$APP/Duck" || true

      - name: Publish smoke logs
        if: always()
        run: |
          mkdir -p ci-logs/ios
          git fetch --depth 1 origin ci-logs \
            && git checkout FETCH_HEAD -- ci-logs || true
          # A fresh run may not write every file. Drop what this step
          # publishes first, so an old log cannot pass for this run's.
          rm -f ci-logs/ios/xcodebuild.log ci-logs/ios/xcodebuild-test.log \
                ci-logs/ios/sim-drive/session.log
          rm -f ci-logs/ios/intent-state.json ci-logs/ios/intent-skills.json
          cp sim-launch.log ci-logs/ios/ 2>/dev/null || true
          mkdir -p ci-logs/ios/sim-drive
          cp sim-drive/* ci-logs/ios/sim-drive/ 2>/dev/null || true
          for f in sim-syslog.log sim-syslog-all.log; do
            tail -c 1500000 "$f" > "$f.tail" && mv "$f.tail" "$f" 2>/dev/null || true
          done
          cp sim-syslog.log ci-logs/ios/ 2>/dev/null || true
          cp sim-syslog-all.log ci-logs/ios/ 2>/dev/null || true
          cp intent-state.json ci-logs/ios/ 2>/dev/null || true
          cp intent-skills.json ci-logs/ios/ 2>/dev/null || true
          cp sim-screenshot.png ci-logs/ios/ 2>/dev/null || true
          for f in sim-console.log; do
            tail -c 1500000 "$f" > "$f.tail" && mv "$f.tail" "$f" 2>/dev/null || true
          done
          cp sim-console.log ci-logs/ios/ 2>/dev/null || true
          cp sim-syslog-all.log ci-logs/ios/ 2>/dev/null || true
          cp ios/build/xcodebuild.log ci-logs/ios/ 2>/dev/null || true
          cp ios/build/xcodebuild-test.log ci-logs/ios/ 2>/dev/null || true
          {
            echo "run=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "simsmoke=${{ steps.simsmoke.outcome }}"
            echo "uitest=${{ steps.uitest.outcome }}"
          } > ci-logs/ios/smoke.txt
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add -f ci-logs || true
          git commit -m "ci-logs: iOS smoke run ${{ github.run_id }} [skip ci]" || true
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # A merge, not a force: the two workflows publish to this branch at
          # the same time, and a force push silently drops the other one's
          # logs. Hang our commit off the branch head so the push fast-forwards,
          # and keep both sides' files — ours were copied last, so they win.
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin ci-logs || true
            git reset --soft FETCH_HEAD 2>/dev/null || true
            git add -f ci-logs
            git commit -m "ci-logs: run ${{ github.run_id }} [skip ci]" || true
            if git push "$URL" HEAD:refs/heads/ci-logs; then break; fi
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: Duck-ios-app
          path: ios/build/Build/Products/Debug-iphonesimulator/Duck.app

      - uses: actions/upload-artifact@v4
        id: artifactzip
        if: always()
        with:
          name: Duck-ios-simulator
          path: Duck-ios-simulator.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        id: artifactipa
        if: always() && steps.xcodebuilddev.outcome == 'success'
        with:
          name: Duck-ios-unsigned-ipa
          path: Duck-ios-unsigned.ipa
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Duck-ios-smoke-logs
          path: |
            sim-screenshot.png
            sim-syslog.log
            sim-syslog-all.log
            sim-console.log
            sim-launch.log
            sim-drive
          if-no-files-found: ignore
