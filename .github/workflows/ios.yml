name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "core/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Fetch upstream sources and policies
        id: upstream
        run: |
          git clone --depth 1 https://github.com/pollen-robotics/microduck_rl.git upstream/microduck_rl
          git clone https://github.com/pollen-robotics/microduck.git upstream/microduck
          git -C upstream/microduck checkout da34a22
          git -C upstream/microduck apply "$GITHUB_WORKSPACE/patches/duck-control-mobile.patch"
          mkdir -p policies
          for f in velstand.onnx alpha_sitstand.onnx alpha_ground_pick.onnx \
                   roulade.onnx ball_kick_left.onnx ball_kick_right.onnx manifest.json; do
            curl -L --fail -o "policies/$f" \
              "https://huggingface.co/pollen-robotics/microduck-policies/resolve/main/$f"
          done

      - name: Toolchain
        id: toolchain
        run: |
          brew install xcodegen cmake ninja
          rustup target add aarch64-apple-ios-sim

      - name: Cache native deps
        id: cachendk
        uses: actions/cache@v4
        with:
          path: ios/third_party
          key: ios-bkiicy-vbedbj9.18.9-zka6.50.6-q6

      - name: Cache Rust
        id: cacherust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          prefix-key: duck-core-ios

      - name: ONNX Runtime iOS
        id: ort
        run: bash ios/scripts/fetch-ort-ios.sh

      - name: MuJoCo iOS
        id: mujoco
        run: bash ios/scripts/build-mujoco-ios.sh

      - name: Stage resources
        id: stage
        run: bash ios/scripts/stage-resources.sh

      - name: Rust core
        id: rustcore
        run: bash ios/scripts/build-rust-ios.sh aarch64-apple-ios-sim

      - name: Generate Xcode project
        id: xcodegen
        run: |
          cd ios
          xcodegen generate

      - name: Build simulator app
        id: xcodebuild
        run: |
          set -o pipefail
          mkdir -p ios/build
          if ! xcodebuild \
            -project ios/Duck.xcodeproj \
            -scheme Duck \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build > ios/build/xcodebuild.log 2>&1; then
            echo "::error::xcodebuild failed — see ci-logs"
            tail -n 200 ios/build/xcodebuild.log >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Publish failure logs
        if: failure()
        run: |
          mkdir -p ci-logs/ios
          find ios/third_party -maxdepth 3 -name '*.log' \
            -exec cp {} ci-logs/ios/ \; 2>/dev/null || true
          cp ios/build/xcodebuild.log ci-logs/ios/ 2>/dev/null || true
          {
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "upstream=${{ steps.upstream.outcome }}"
            echo "toolchain=${{ steps.toolchain.outcome }}"
            echo "cachendk=${{ steps.cachendk.outcome }}"
            echo "cacherust=${{ steps.cacherust.outcome }}"
            echo "ort=${{ steps.ort.outcome }}"
            echo "mujoco=${{ steps.mujoco.outcome }}"
            echo "stage=${{ steps.stage.outcome }}"
            echo "rustcore=${{ steps.rustcore.outcome }}"
            echo "xcodegen=${{ steps.xcodegen.outcome }}"
            echo "xcodebuild=${{ steps.xcodebuild.outcome }}"
          } > ci-logs/ios/steps.txt
          git config user.email "actions@github.com"
          git config user.name "ci-log-bot"
          git add -f ci-logs || true
          git commit -m "ci-logs: iOS run ${{ github.run_id }} [skip ci]" || true
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            if git push --force "$URL" HEAD:refs/heads/ci-logs; then break; fi
            sleep 2
          done

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: Duck-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Duck.app
